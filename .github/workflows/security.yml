name: Pipeline de sécurité

on:
  push:
  pull_request:

jobs:
  tests:
    name: Suite de tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  secrets:
    name: Scanner de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On lance gitleaks nous-mêmes : sur un push, gitleaks-action ne scanne
      # que les nouveaux commits, alors qu'on veut scanner tout le dépôt.
      - name: Installer gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scanner tout le dépôt
        run: ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  dependencies:
    name: Dépendances connues (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
